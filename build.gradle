import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

//version = project.mod_version + "+" + project.minecraft_version
version = project.dev_version + "-" + "DEV"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.maxhenkel.de/repository/public" }
    maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
    maven { url = "https://api.modrinth.com/maven" }

    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }

    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "strayers-skyblock-utils" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    clientCompileOnly "maven.modrinth:skyblocker-liap:v6.10.4+26.2"

    api("me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    include(implementation("io.github.jaredmdobson:concentus:1.0.2"))
    include(implementation("de.maxhenkel.rnnoise4j:rnnoise4j:2.1.2"))

    runtimeOnly("me.djtheredstoner:DevAuth-fabric:1.2.2")
}

def emojiSourceDir = file("src/main/resources/assets/skyblockutils/textures/font/emojis")
def emojiOutputDir = layout.buildDirectory.dir("generated/emojis")

def generateEmojiFont = tasks.register("generateEmojiFont") {
    inputs.files(fileTree(emojiSourceDir) { include "*.png", "emojis.json" })
    outputs.dir(emojiOutputDir)

    doLast {
        def outDir = emojiOutputDir.get().asFile
        outDir.deleteDir()

        def atlas = new JsonSlurper().parse(new File(emojiSourceDir, "emojis.json"))
        int base = Integer.parseInt(atlas.base as String, 16)
        int columns = atlas.columns as int
        List atlasEmojis = atlas.emojis

        def providers = []
        def custom = []
        int nextId = 0xE800

        emojiSourceDir.listFiles()
                .findAll { it.name.endsWith(".png") && it.name != "emojis.png" }
                .sort { it.name }
                .each { f ->
                    if (nextId > 0xE8FF) throw new GradleException("Too many custom emojis (max 256)")
                    int cp = nextId++
                    providers << [type: "bitmap", file: "skyblockutils:font/emojis/" + f.name, ascent: 7, height: 8, chars: [new String(Character.toChars(cp))]]
                    custom << [name: f.name.substring(0, f.name.length() - 4), cp: cp]
                }

        int rowCount = (int) Math.ceil(atlasEmojis.size() / (double) columns)
        def rows = (0..<rowCount).collect { r ->
            (0..<columns).collect { c ->
                int i = r * columns + c
                i < atlasEmojis.size() ? new String(Character.toChars(base + i)) : "\u0000"
            }.join()
        }
        providers << [type: "bitmap", file: "skyblockutils:font/emojis/emojis.png", ascent: 7, height: 8, chars: rows]

        def normal = atlasEmojis.withIndex().collect { e, i -> [name: e.name, aliases: e.aliases ?: [], category: e.category, cp: base + i] }

        def fontFile = new File(outDir, "assets/skyblockutils/font/emojis.json")
        fontFile.parentFile.mkdirs()
        fontFile.setText(JsonOutput.toJson([providers: providers]), "UTF-8")

        def indexFile = new File(outDir, "assets/skyblockutils/emojis/index.json")
        indexFile.parentFile.mkdirs()
        indexFile.setText(JsonOutput.toJson([custom: custom, normal: normal]), "UTF-8")
    }
}

sourceSets.main.resources.srcDir(generateEmojiFont)

processResources {
    inputs.property "version", project.version

    exclude "assets/skyblockutils/textures/font/emojis/*.json"

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}